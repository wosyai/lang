[package]
name = "wosy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
native-diagnostics = ["wosy-protocol/native-diagnostics", "wosy-daemon/native-diagnostics"]

[[example]]
name = "native_known_diagnostics_client"
required-features = ["native-diagnostics"]

[dependencies]
wosy-daemon = { path = "../wosy-daemon" }
rowan.workspace = true
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
wosy-protocol = { path = "../wosy-protocol" }
blake3.workspace = true
clap.workspace = true
codespan-reporting.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }
wosy-compiler.workspace = true
wosy-project.workspace = true
wosy-syntax.workspace = true

[[bin]]
name = "wosy"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "time"] }
toml_edit.workspace = true
