[package]
name = "wosy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The standard CLI exposes `check`. The opt-out keeps a build-only developer configuration.
default = ["internal-checker"]
internal-checker = ["wosy-compiler/internal-checker", "wosy-project/internal-checker", "dep:rustix", "dep:toml_edit"]

[dependencies]
blake3.workspace = true
clap.workspace = true
codespan-reporting.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit = { workspace = true, optional = true }
wosy-compiler.workspace = true
wosy-project.workspace = true
wosy-syntax.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"], optional = true }

[[bin]]
name = "wosy"
path = "src/main.rs"

[[example]]
name = "inspect-ordered-check"
required-features = ["internal-checker"]
test = false

[dev-dependencies]
toml_edit.workspace = true
