[package]
name = "wosy-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
wosy-syntax.workspace = true
surrealkv = { version = "1.4", default-features = false }
wosy-protocol = { path = "../wosy-protocol" }
blake3.workspace = true
rowan.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
wosy-project.workspace = true
wosy-compiler.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["codec"] }
bytes = "1"
