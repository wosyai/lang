[package]
name = "wosy-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
native-diagnostics = ["tokio/net", "dep:rustix"]

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", optional = true, features = ["process"] }
[dependencies]
blake3.workspace = true
bytes = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-util"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["codec"] }
wosy-project.workspace = true
wosy-syntax.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
