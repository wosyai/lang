[workspace]
resolver = "2"
members = [
    "crates/wosy-syntax",
    "crates/wosy-project",
    "crates/wosy-compiler",
    "crates/wosy-protocol",
    "crates/wosy-daemon",
    "crates/wosy-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wosy-compiler = { path = "crates/wosy-compiler" }
wosy-project = { path = "crates/wosy-project" }
wosy-syntax = { path = "crates/wosy-syntax" }
