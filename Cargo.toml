[workspace]
resolver = "2"
members = [
    "crates/wosy-syntax",
    "crates/wosy-project",
    "crates/wosy-compiler",
    "crates/wosy-protocol",
    "crates/wosy-daemon",
    "crates/wosy-cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
codespan-reporting = "0.11"
inkwell = { version = "0.10.0", features = ["llvm18-1-force-static"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = { version = "0.5", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
rowan = "0.16"
toml_edit = "0.22"
wosy-compiler = { path = "crates/wosy-compiler" }
wosy-project = { path = "crates/wosy-project" }
wosy-syntax = { path = "crates/wosy-syntax" }

[profile.dev]
debug = "line-tables-only"
