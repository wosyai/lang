[[steps]]
command = ["wosy", "build", "app"]
exit = 0

[[steps]]
command = ["wosy", "build", "invalid"]
exit = 0

[[assert]]
command = ["wosy", "run", "app"]
exit = 0
stdout = "expected/empty"
stderr = "expected/empty"
exact = true

[[assert]]
command = ["wosy", "run", "invalid"]
exit = 1
stdout = "expected/empty"
stderr = "expected/empty"
exact = true
