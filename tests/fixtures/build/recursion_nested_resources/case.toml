[[steps]]
command = ["wosy", "build", "host"]
exit = 0

[[steps]]
command = ["wosy", "build", "wasi"]
exit = 0

[[assert]]
command = ["wosy", "run", "host"]
exit = 0
stdout = "expected/complete.stdout"
stderr = "expected/empty"
exact = true

[[assert]]
command = ["wosy", "run", "wasi"]
exit = 0
stdout = "expected/complete.stdout"
stderr = "expected/empty"
exact = true
