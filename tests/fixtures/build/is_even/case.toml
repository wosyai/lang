shared_stdlib = true

[[steps]]
command = ["wosy", "build", "app"]
exit = 0

[[assert]]
source = "project/src/classify.w"
fd_read = [
  { capacity = 1, bytes = [52], errno = 0 },
  { capacity = 1, bytes = [10], errno = 0 },
]
stdout = "expected/even.stdout"
exact = true

[[assert]]
source = "project/src/classify.w"
fd_read = [
  { capacity = 1, bytes = [55], errno = 0 },
  { capacity = 1, bytes = [10], errno = 0 },
]
stdout = "expected/odd.stdout"
exact = true

[[assert]]
source = "project/src/classify.w"
fd_read = [
  { capacity = 1, bytes = [49], errno = 0 },
  { capacity = 1, bytes = [50], errno = 0 },
  { capacity = 1, bytes = [120], errno = 0 },
  { capacity = 1, bytes = [10], errno = 0 },
]
stdout = "expected/invalid.stdout"
exact = true

[[assert]]
source = "project/src/classify.w"
fd_read = [{ capacity = 1, bytes = [], errno = 0 }]
stdout = "expected/eof.stdout"
exact = true
