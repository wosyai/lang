shared_stdlib = true

[[steps]]
command = ["wosy", "build", "host"]
exit = 0

[[steps]]
command = ["wosy", "build", "wasi"]
exit = 0

[[assert]]
command = ["wosy", "run", "host"]
exit = 0
stdout = "expected/empty"
stderr = "expected/empty"
exact = true

[[assert]]
command = ["wosy", "run", "wasi"]
exit = 0
stdout = "expected/empty"
stderr = "expected/empty"
exact = true

[[assert]]
source = "project/src/null.w"
command = ["wosy", "build", "host"]
exit = 0

[[assert]]
command = ["wosy", "run", "host"]
exit = 1
stdout = "expected/empty"
stderr = "expected/empty"
exact = true

