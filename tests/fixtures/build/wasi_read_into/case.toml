shared_stdlib = true

[[steps]]
command = ["wosy", "build", "app"]
exit = 0

[[steps]]
source = "project/src/read_private.w"
command = ["wosy", "build", "app"]
exit = 1

[[assert]]
source = "project/src/read_private.w"
command = ["wosy", "build", "app"]
exit = 1
stderr_contains = ["M0002", "_fd_read", "_fd_read_once", "_ReadIovec", "_Nread"]

[[assert]]
source = "project/src/read_bytes.w"
fd_read = [
  { capacity = 4, bytes = [65, 66], errno = 0 },
  { capacity = 4, bytes = [], errno = 0 },
]
stdout = "expected/read_bytes.stdout"
exact = true

[[assert]]
source = "project/src/read_error.w"
fd_read = [{ capacity = 4, bytes = [], errno = 5 }]
stdout = "expected/read_error.stdout"
exact = true

[[assert]]
source = "project/src/read_zero.w"
fd_read = []
stdout = "expected/read_zero.stdout"
exact = true

[[assert]]
source = "project/src/read_oversized.w"
fd_read = []
stdout = "expected/read_oversized.stdout"
exact = true
