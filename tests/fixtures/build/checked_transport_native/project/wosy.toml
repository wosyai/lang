[package]
name = "checked_transport_native"
default_target = "app"

[comments]
categories = []

[builders.native]
command = ["python", "scripts/build-native"]
args = []
toolchain_identity = "llvm-18.1.4"

[runners.native]
command = ["python", "scripts/run-native"]
args = []

[targets.app]
root = "src/main.w"

[targets.app.artifacts.main]
artifact = "Main"

[targets.app.artifacts.main.profiles.dev]
backend = "llvm"
output = "native"
builder = "native"
run_runner = "native"

[targets.app.profiles.dev]
main_artifact = "main"

[targets.invalid]
root = "src/invalid.w"

[targets.invalid.artifacts.main]
artifact = "Main"

[targets.invalid.artifacts.main.profiles.dev]
backend = "llvm"
output = "native"
builder = "native"
run_runner = "native"

[targets.invalid.profiles.dev]
main_artifact = "main"
