[package]
name = "callable_field_captures"
default_target = "app"

[dependencies.std]
path = "stdlib"

[comments]
categories = []

[builders.wasm]
command = ["python", "scripts/build-wasm"]
args = []
toolchain_identity = "llvm-18.1.4"

[runners.wasm]
command = ["python", "scripts/run-wasmtime"]
args = []

[builders.native]
command = ["python", "scripts/build-native"]
args = []
toolchain_identity = "llvm-18.1.4"

[runners.native]
command = ["python", "scripts/run-native"]
args = []

[builders.global_native]
command = ["python", "scripts/build-global-native"]
args = []
toolchain_identity = "llvm-18.1.4"

[builders.global_wasm]
command = ["python", "scripts/build-global-wasm"]
args = []
toolchain_identity = "llvm-18.1.4"

[targets.app]
root = "src/main.w"

[targets.app.artifacts.main]
artifact = "CallableFieldCaptures"

[targets.app.artifacts.main.profiles.dev]
backend = "llvm"
output = "wasm-wasip1"
builder = "wasm"
run_runner = "wasm"

[targets.app.profiles.dev]
main_artifact = "main"

[targets.native]
root = "src/native.w"

[targets.native.artifacts.main]
artifact = "CallableFieldCapturesNative"

[targets.native.artifacts.main.profiles.dev]
backend = "llvm"
output = "native"
builder = "native"
run_runner = "native"

[targets.native.profiles.dev]
main_artifact = "main"

[builders.branch_native]
command = ["python", "scripts/build-branch-native"]
args = []
toolchain_identity = "llvm-18.1.4"

[targets.branch_native]
root = "src/branch.w"

[targets.branch_native.artifacts.main]
