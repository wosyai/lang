shared_stdlib = true

[[steps]]
command = ["wosy", "build", "app"]
exit = 0

[[assert]]
command = ["wosy", "run", "app"]
exit = 7
stdout = "expected/valid.stdout"
stderr = "expected/empty"
exact = true

[[assert]]
source = "project/src/invalid.w"
command = ["wosy", "run", "app"]
exit = 3
stdout = "expected/invalid.stdout"
stderr = "expected/empty"
exact = true

[[assert]]
source = "project/src/format_char.w"
command = ["wosy", "run", "app"]
exit = 0
stdout = "expected/format_char.stdout"
stderr = "expected/empty"
exact = true

[[assert]]
source = "project/src/format_appcall.w"
command = ["wosy", "run", "app"]
exit = 0
stdout = "expected/format_appcall.stdout"
stderr = "expected/empty"
exact = true

[[assert]]
source = "project/src/parse_u128_boundary.w"
command = ["wosy", "run", "app"]
exit = 0
stdout = "expected/parse_u128_boundary.stdout"
stderr = "expected/empty"
exact = true
