[[steps]]
command = ["wosy", "build", "app", "--profile", "native"]
exit = 0

[[steps]]
command = ["wosy", "build", "app", "--profile", "wasi"]
exit = 0

[[assert]]
command = ["wosy", "run", "app", "--profile", "native"]
exit = 0
stdout = "expected/empty"
stderr = "expected/empty"
exact = true

[[assert]]
command = ["wosy", "run", "app", "--profile", "wasi"]
exit = 0
stdout = "expected/empty"
stderr = "expected/empty"
exact = true
