[package]
name = "production_discard"
default_target = "native"

[dependencies.std]
path = "stdlib"

[comments]
categories = []

[builders.native]
command = ["python", "scripts/build.py", "native"]
args = []
toolchain_identity = "llvm-18.1.4"

[builders.wasm]
command = ["python", "scripts/build.py", "wasm"]
args = []
toolchain_identity = "llvm-18.1.4"

[runners.native]
command = ["python", "scripts/run.py", "native"]
args = []

[runners.wasm]
command = ["python", "scripts/run.py", "wasm"]
args = []

[targets.native]
root = "src/main.w"

[targets.native.artifacts.main]
artifact = "Main"

[targets.native.artifacts.main.profiles.dev]
backend = "llvm"
output = "native"
builder = "native"
run_runner = "native"

[targets.native.profiles.dev]
main_artifact = "main"

[targets.wasm]
root = "src/main.w"

[targets.wasm.artifacts.main]
artifact = "Main"

[targets.wasm.artifacts.main.profiles.dev]
backend = "llvm"
output = "wasm-wasip1"
builder = "wasm"
run_runner = "wasm"

[targets.wasm.profiles.dev]
main_artifact = "main"
