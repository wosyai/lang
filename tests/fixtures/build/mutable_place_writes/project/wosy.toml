[package]
name = "mutable_place_writes"
default_target = "app"

[dependencies.std]
path = "stdlib"

[comments]
categories = []

[builders.llvm-wasm]
command = ["python", "scripts/build-wasm"]
args = []
toolchain_identity = "llvm-18.1.3"

[runners.wasmtime-wasip1]
command = ["python", "scripts/run-wasmtime"]
args = []

[targets.app]
root = "src/main.w"

[targets.app.artifacts.main]
artifact = "MutablePlaceWrites"

[targets.app.artifacts.main.profiles.dev]
backend = "llvm"
output = "wasm-wasip1"
runtime = "wasm32"
builder = "llvm-wasm"
run_runner = "wasmtime-wasip1"

[targets.app.profiles.dev]
main_artifact = "main"
